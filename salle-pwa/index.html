<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d4531f">
<meta name="apple-mobile-web-app-title" content="Salle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Salle – par énergie</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mut:#6b6a64;--ac:#d4531f;--ln:#e4e2db;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#9a988f;--ac:#f0743f;--ln:#34332f;--ok:#5cc58a}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#9a988f;--ac:#f0743f;--ln:#34332f;--ok:#5cc58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 6px;font:inherit;font-size:14px;text-align:center}
.tab b{display:block;font-size:20px}
.tab[aria-selected="true"]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.meta{color:var(--mut);font-size:14px;margin:0 0 12px}
.pick{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.pill{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px}
.pill[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.ex{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font:inherit;text-align:left}
.ex:last-child{border-bottom:0}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;font-size:18px;color:#fff}
.ex[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.ex[aria-checked="true"] .nm{text-decoration:line-through;color:var(--mut)}
.nm{font-size:17px}
.sub{display:block;color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:0 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.reset{margin-top:16px;width:100%;border:1px solid var(--ln);background:none;color:var(--mut);border-radius:12px;padding:13px;font:inherit}
.rules{margin-top:22px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Séance du jour</h1>
<div class="tabs" id="tabs" role="tablist"></div>
<p class="meta" id="meta"></p>
<div class="pick" id="pick"></div>
<div class="bar"><i id="prog"></i></div>
<div class="card" id="list"></div>
<button class="reset" id="reset">Remettre à zéro</button>
<div class="rules">Règle : pas deux pleines énergies sur le même groupe à moins de 48 h. Si tu hésites, commence par la version moyenne.</div>
</main>
<script>
var L=[
{k:"full",e:"🔥",n:"Pleine",t:"60-75 min · 5 exercices · 3-4 séries de 12-20 reps",s:[
{n:"Pecs + triceps",x:["Développé incliné haltères","Développé couché machine ou barre","Écartés poulie","Triceps poulie","Extensions nuque","Marche inclinée 20-30 min"]},
{n:"Dos + biceps",x:["Tirage vertical ou tractions","Rowing","Tirage horizontal","Curl biceps","Face pulls","Marche inclinée 20-30 min"]},
{n:"Épaules + bras + abdos",x:["Développé épaules","Élévations latérales","Oiseau (arrière d’épaule)","Curl marteau","Abdos poulie","Marche inclinée 20-30 min"]}]},
{k:"mid",e:"⚡",n:"Moyenne",t:"45 min · 4 exercices · beaucoup de reps, repos courts",s:[
{n:"Push",x:["Pecs","Épaules","Élévations latérales","Triceps","Marche inclinée 15-20 min"]},
{n:"Pull",x:["Dos vertical","Dos horizontal","Arrière d’épaule","Biceps","Marche inclinée 15-20 min"]},
{n:"Mix haut du corps",x:["Pecs","Dos","Épaules","Superset bras","Marche inclinée 15-20 min"]}]},
{k:"rest",e:"🌿",n:"Repos actif",t:"20-50 min · sans charge lourde",s:[
{n:"Marche + mobilité",x:["Marche inclinée avec variations 30-50 min","Mobilité épaules","Mobilité dos","Mobilité hanches","Gainage ou abdos léger (option)"]}]}];
var S={l:0,s:0,c:{}};
try{var r=localStorage.getItem("salle");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("salle",JSON.stringify(S))}catch(e){}}
function key(i){return S.l+"-"+S.s+"-"+i}
function render(){
var lv=L[S.l];if(!lv.s[S.s])S.s=0;var se=lv.s[S.s];
document.getElementById("tabs").innerHTML=L.map(function(a,i){return '<button class="tab" role="tab" aria-selected="'+(i==S.l)+'" data-l="'+i+'"><b>'+a.e+'</b>'+a.n+'</button>'}).join("");
document.getElementById("meta").textContent=lv.t;
document.getElementById("pick").innerHTML=lv.s.length>1?lv.s.map(function(a,i){return '<button class="pill" aria-pressed="'+(i==S.s)+'" data-s="'+i+'">'+a.n+'</button>'}).join(""):"";
var done=0;
document.getElementById("list").innerHTML=se.x.map(function(x,i){var c=!!S.c[key(i)];if(c)done++;return '<button class="ex" role="checkbox" aria-checked="'+c+'" data-i="'+i+'"><span class="box">'+(c?"✓":"")+'</span><span class="nm">'+x+'</span></button>'}).join("");
document.getElementById("prog").style.width=Math.round(100*done/se.x.length)+"%";
}
document.addEventListener("click",function(e){
var t=e.target.closest("button");if(!t)return;
if(t.dataset.l!==undefined){S.l=+t.dataset.l;S.s=0}
else if(t.dataset.s!==undefined){S.s=+t.dataset.s}
else if(t.dataset.i!==undefined){var k=key(+t.dataset.i);S.c[k]=!S.c[k]}
else if(t.id==="reset"){S.c={}}
else return;
save();render();
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
